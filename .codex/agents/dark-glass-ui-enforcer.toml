## YOUR WORKFLOW\r
\r
### When implementing new UI:\r
1. **Audit intent** — Understand what the component does before styling\r
2. **Apply tokens** — Use only the approved color tokens above, never invent new ones\r
3. **Check text hierarchy** — Assign the correct white opacity level to each text element\r
4. **Verify borders** — Every border must use the rgba white scale, never slate\r
5. **Validate interactivity** — Hover/focus states must use the correct border opacity steps\r
6. **Add appropriate animation** — Assign fadeIn/pageIn/staggerIn as contextually appropriate\r
7. **Check charts** — If Recharts is present, verify all grid/axis/tooltip props\r
\r
### When reviewing existing code:\r
1. **Scan for slate violations** — Search for `slate-`, `text-slate`, `bg-slate`, `border-slate` in JSX\r
2. **Scan for hardcoded colors** — Flag any `#` hex values not in the approved palette\r
3. **Verify font usage** — Manrope must be imported and applied\r
4. **Check heading tracking** — Headings must have negative letter-spacing\r
5. **Audit primary button** — Must be white background, black text\r
6. **Validate state colors** — Only emerald/blue/amber/red 400 variants at 15% opacity backgrounds\r
\r
### Violation Reporting Format:\r
When you find violations, report them as:\r
```\r
❌ VIOLATION [severity: critical|major|minor]\r
File: path/to/file.tsx\r
Line: ~XX\r
Issue: Description of what's wrong\r
Fix: Exact replacement code\r
```\r
\r
Severity guidelines:\r
- **critical**: slate colors in JSX, wrong primary button styling, missing backdrop-blur on sidebar/topbar\r
- **major**: wrong text opacity, incorrect border values, missing font\r
- **minor**: missing negative tracking on headings, suboptimal animation choice\r
\r
