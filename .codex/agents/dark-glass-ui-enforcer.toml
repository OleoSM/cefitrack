## KEYFRAME ANIMATIONS (index.css)\r
\r
Implement and maintain these exact keyframes:\r
\r
```css\r
/* fadeIn */\r
@keyframes fadeIn {\r
  from { opacity: 0; transform: translateY(8px); }\r
  to   { opacity: 1; transform: translateY(0); }\r
}\r
.animate-fadeIn {\r
  animation: fadeIn 280ms ease-out both;\r
}\r
\r
/* pageIn */\r
@keyframes pageIn {\r
  from { opacity: 0; transform: translateY(12px); }\r
  to   { opacity: 1; transform: translateY(0); }\r
}\r
.animate-pageIn {\r
  animation: pageIn 240ms cubic-bezier(0.22, 1, 0.36, 1) both;\r
}\r
\r
/* staggerIn — base keyframe, controlled via delay utilities */\r
@keyframes staggerIn {\r
  from { opacity: 0; transform: translateY(14px); }\r
  to   { opacity: 1; transform: translateY(0); }\r
}\r
.stagger-1 { animation: staggerIn 280ms ease-out 0.04s both; }\r
.stagger-2 { animation: staggerIn 280ms ease-out 0.09s both; }\r
.stagger-3 { animation: staggerIn 280ms ease-out 0.14s both; }\r
.stagger-4 { animation: staggerIn 280ms ease-out 0.19s both; }\r
.stagger-5 { animation: staggerIn 280ms ease-out 0.24s both; }\r
.stagger-6 { animation: staggerIn 280ms ease-out 0.29s both; }\r
\r
/* shimmer — skeleton loading */\r
@keyframes shimmer {\r
  from { background-position: -200% center; }\r
  to   { background-position:  200% center; }\r
}\r
.animate-shimmer {\r
  background: linear-gradient(\r
    90deg,\r
    rgba(255,255,255,0.04) 25%,\r
    rgba(255,255,255,0.10) 50%,\r
    rgba(255,255,255,0.04) 75%\r
  );\r
  background-size: 200% 100%;\r
  animation: shimmer 1.5s linear infinite;\r
}\r
\r
/* glowPulse */\r
@keyframes glowPulse {\r
  0%, 100% { box-shadow: 0 0 0px rgba(255,215,0,0); }\r
  50%       { box-shadow: 0 0 6px rgba(255,215,0,0.8); }\r
}\r
.animate-glowPulse {\r
  animation: glowPulse 2s ease-in-out infinite;\r
}\r
\r
/* marquee */\r
@keyframes marquee {\r
  from { transform: translateX(0); }\r
  to   { transform: translateX(-50%); }\r
}\r
.animate-marquee {\r
  animation: marquee 28s linear infinite;\r
}\r
