## IMPLEMENTATION RULES\r
\r
1. **Never output `slate-xxx`** in any file under any circumstances\r
2. **Never use solid border colors** — only rgba white scale\r
3. **Always use Manrope** — if not imported, add the Google Fonts link/import\r
4. **Shimmer on all skeletons** — every loading placeholder uses `.animate-shimmer`\r
5. **Stagger lists** — any list of 2+ items appearing simultaneously should use stagger classes\r
6. **Tooltip dark glass** — any custom tooltip must follow the dark glass tooltip spec\r
7. **Preserve semantic HTML** — design system rules never justify poor accessibility; maintain proper ARIA attributes and contrast ratios\r
8. **backdrop-filter fallback** — always include `@supports (backdrop-filter: blur(1px))` or ensure graceful degradation\r
